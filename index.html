<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>작아지기 시뮬레이터</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:"Noto Sans KR",sans-serif;color:#fff;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
.glass{background:rgba(20,22,28,.62);border-radius:10px;backdrop-filter:blur(4px)}
#chat{position:fixed;left:10px;top:10px;width:min(340px,46vw);padding:8px 10px;font-size:13px;line-height:1.45;pointer-events:none;max-height:150px;overflow:hidden}
#chat .m{text-shadow:0 1px 2px #000;animation:fadeIn .3s}
#chat .sys{color:#ffe17a}
#lb{position:fixed;right:10px;top:10px;width:min(300px,48vw);font-size:12.5px;overflow:hidden}
#lb .hd{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;font-weight:900;background:rgba(0,0,0,.35);cursor:pointer}
#lb table{width:100%;border-collapse:collapse}
#lb th{font-weight:700;color:#bfc6d4;font-size:11px;padding:4px 6px;text-align:left}
#lb td{padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
#lb tr.me td{background:rgba(255,215,64,.18);color:#ffe066;font-weight:900}
#lb td.n{text-align:right;font-variant-numeric:tabular-nums}
#side{position:fixed;left:10px;top:168px;display:flex;flex-direction:column;gap:5px}
.sbtn{width:54px;height:51px;border:none;border-radius:14px;background:rgba(20,22,28,.7);color:#fff;font:900 11px "Noto Sans KR";display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.sbtn b{font-size:21px;line-height:1}
.sbtn:active{transform:translateY(2px);box-shadow:none}
.sbtn.glow{animation:glow 1s infinite alternate}
@keyframes glow{to{background:rgba(60,160,80,.85)}}
#stats{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:10px;align-items:stretch}
.st{padding:8px 18px 9px;text-align:center;min-width:128px;border-radius:16px;border:3px solid rgba(255,255,255,.85);box-shadow:0 5px 0 rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.45)}
.st small{display:block;font-size:14px;color:#fff;font-weight:900;letter-spacing:.5px}
.st span{display:block;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
.st.c1{background:linear-gradient(#4dabf7,#1c7ed6)}.st.c2{background:linear-gradient(#ffd43b,#f59f00)}.st.c3{background:linear-gradient(#69db7c,#2f9e44)}.st.c4{background:linear-gradient(#b197fc,#7048e8)}
#auto{position:fixed;right:12px;top:50%;transform:translateY(-50%);width:96px;height:96px;border-radius:20px;border:3px solid #fff;background:linear-gradient(#868e96,#495057);color:#fff;font:900 15px "Noto Sans KR";box-shadow:0 5px 0 rgba(0,0,0,.4);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#auto b{font-size:30px;line-height:1}
#chatBtn{position:fixed;right:12px;top:calc(50% + 62px);width:96px;height:56px;border-radius:16px;border:3px solid #fff;background:linear-gradient(#4dabf7,#1c7ed6);color:#fff;font:900 15px "Noto Sans KR";box-shadow:0 5px 0 rgba(0,0,0,.4);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#quick{position:fixed;right:120px;top:calc(50% - 40px);display:none;grid-template-columns:1fr 1fr;gap:6px;padding:10px;background:rgba(20,22,28,.85);border-radius:14px;z-index:15;width:280px}
#quick button{border:none;border-radius:10px;padding:9px 6px;font:900 14px "Noto Sans KR";color:#222;background:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35)}
#quick button:active{transform:translateY(2px);box-shadow:none}#auto.on{background:linear-gradient(#69db7c,#2b8a3e);animation:glow2 1s infinite alternate}
@keyframes glow2{to{box-shadow:0 5px 0 rgba(0,0,0,.4),0 0 18px #8ce99a}}
.sbtn svg{width:30px;height:30px}
#hint{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);width:min(420px,80vw);padding:6px 10px;font-size:12.5px;font-weight:700;text-align:center}
#hint .bar{height:7px;border-radius:4px;background:rgba(255,255,255,.18);margin-top:4px;overflow:hidden}
#hint .bar i{display:block;height:100%;background:linear-gradient(90deg,#5ee27a,#2fb7ff);width:0}
#record{position:fixed;left:10px;bottom:96px;font-size:16px;font-weight:700;color:#fff;background:rgba(0,0,0,.6);padding:6px 14px;border-radius:10px;pointer-events:none;z-index:5}
#record b{color:#ffe066}
#prompt{position:fixed;left:50%;bottom:132px;transform:translateX(-50%);display:none}
#prompt button{border:none;border-radius:12px;padding:10px 18px;font:900 15px "Noto Sans KR";color:#fff;background:#2b8a3e;box-shadow:0 4px 0 #1b5e2a;cursor:pointer}
#prompt button.no{background:#666;box-shadow:0 4px 0 #333}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-size:20px;font-weight:900;text-align:center;text-shadow:0 2px 0 #000,0 0 8px #000;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
.pop{position:fixed;pointer-events:none;font-weight:900;font-size:18px;color:#7dffb0;text-shadow:0 2px 0 #000;animation:up .8s forwards}
.bigpop{position:fixed;left:50%;top:38%;transform:translateX(-50%);pointer-events:none;font-weight:900;font-size:40px;color:#ffd84a;text-shadow:0 3px 0 #000,0 0 12px #000;animation:big 1.3s forwards;white-space:nowrap}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
@keyframes big{0%{transform:translate(-50%,10px) scale(.6);opacity:0}15%{transform:translate(-50%,0) scale(1.1);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-40px) scale(1);opacity:0}}
@keyframes fadeIn{from{opacity:0}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20}
#panel{width:min(560px,94vw);max-height:86vh;overflow:auto;background:#1d2029;border-radius:16px;border:3px solid #3a3f4d;padding:16px 16px 18px;position:relative}
#panel h2{font-size:22px;font-weight:900;margin-bottom:10px}
#panel .x{position:absolute;right:10px;top:10px;width:36px;height:36px;border:none;border-radius:10px;background:#d9443a;color:#fff;font:900 18px sans-serif;cursor:pointer;box-shadow:0 3px 0 #8e2a23}
.btn{border:none;border-radius:12px;padding:10px 16px;font:900 15px "Noto Sans KR";color:#fff;background:#2b8a3e;box-shadow:0 4px 0 #1b5e2a;cursor:pointer}
.btn:disabled{background:#555;box-shadow:0 4px 0 #333;color:#aaa;cursor:not-allowed}
.btn.blue{background:#1c7ed6;box-shadow:0 4px 0 #134f87}
.btn.small{padding:6px 10px;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:#272b37;border-radius:12px;padding:12px;margin:8px 0}
.pbar{height:14px;border-radius:7px;background:#3a3f4d;overflow:hidden;margin:6px 0}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd43b,#ff922b)}
.pets{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:8px}
.pet{background:#272b37;border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer;border:3px solid transparent;position:relative}
.pet.eq{border-color:#51cf66;background:#23362a}
.pet .e{width:70px;height:70px;display:block;margin:0 auto}
#nameIn{width:100%;padding:12px;border-radius:10px;border:2px solid #4b5160;background:#11131a;color:#fff;font:900 18px 'Noto Sans KR';user-select:text;-webkit-user-select:text;margin:8px 0}
#hView{width:240px;height:240px}
.pet .nm{font-size:12px;font-weight:900}
.pet .mm{font-size:11px;color:#9fe6b0;font-weight:700}
.pet .del{position:absolute;right:3px;top:3px;font-size:11px;background:#0005;border:none;color:#fff;border-radius:6px;padding:1px 4px;cursor:pointer}
.r-일반{color:#ced4da}.r-레어{color:#4dabf7}.r-전설{color:#ffd43b}.r-신화{color:#ff6bcb}
.odds{font-size:12.5px;line-height:1.7;color:#d0d4dc}
#hatch{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;text-align:center}
#hatch .egg{font-size:120px}
#hatch .egg.shake{animation:shake .15s infinite}
@keyframes shake{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}100%{transform:rotate(-12deg)}}
#hatch h3{font-size:30px;font-weight:900;margin:6px 0}
#joy{position:fixed;left:110px;bottom:140px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);display:none;touch-action:none}
#joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.5)}
#jump{position:fixed;right:26px;bottom:140px;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.35);display:none;color:#fff;font:900 14px "Noto Sans KR";touch-action:none}
#loading{position:fixed;inset:0;background:#0d1117;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;z-index:50}
@media (max-width:640px){
 #lb{font-size:11px;width:44vw}#lb td{max-width:70px;padding:2px 4px}#lb th{padding:2px 4px}
 .st{min-width:76px;padding:5px 8px 6px;border-width:2px;border-radius:12px}.st small{font-size:11px}.st span{font-size:18px}#stats{gap:5px}#auto{width:74px;height:74px;font-size:12px}#chatBtn{width:74px;height:46px;font-size:13px;top:calc(50% + 46px)}#quick{right:94px;width:250px}#auto b{font-size:24px}#record{font-size:13px}
 #chat{font-size:11px;max-height:96px}
 .sbtn{width:52px;height:52px}.sbtn b{font-size:20px}
 #stats{bottom:34px}
 #hint{bottom:64px}
}
@media (pointer:coarse){
 #stats{bottom:14px}#record{bottom:84px!important;left:8px}#auto{top:auto;bottom:250px;transform:none}#chatBtn{top:auto;bottom:334px}#quick{top:auto;bottom:250px}
 #hint{bottom:72px;width:44vw;font-size:11px}
 #joy{left:84px;bottom:128px;width:100px;height:100px}#joy i{left:23px;top:23px}
 #jump{bottom:140px;right:14px;width:76px;height:76px}
 #prompt{bottom:236px}
 #side{top:120px;transform:none}
}
@media (pointer:coarse) and (max-height:520px){#side{flex-direction:row;top:auto;bottom:auto;top:108px}#chat{max-height:90px}#joy{bottom:60px;left:auto;right:120px}#jump{bottom:60px}#record{bottom:84px!important}#prompt{bottom:84px}#hint{bottom:62px}}
</style>
</head>
<body>
<div id="loading">작아지기 시뮬레이터 불러오는 중…</div>
<div id="game"></div>
<div id="chat" class="glass"></div>
<div id="lb" class="glass"><div class="hd" id="lbHd"><span>🏆 순위 (작은 순)</span><span><small id="netStat" style="font-weight:700;color:#8ce99a;margin-right:6px"></small><span id="lbTog">▾</span></span></div><table id="lbT"></table></div>
<div id="side">
 <button class="sbtn" id="bRb"><svg viewBox="0 0 32 32"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#f59f00"/></linearGradient></defs><path d="M16 4a12 12 0 1 0 11.3 8" fill="none" stroke="url(#gg)" stroke-width="3.6" stroke-linecap="round"/><path d="M22.5 3.5l6 7.5-9.2 1.8z" fill="#f59f00"/><path d="M16 9.5l2 4.2 4.5.6-3.3 3.1.9 4.5-4.1-2.3-4.1 2.3.9-4.5-3.3-3.1 4.5-.6z" fill="#fff3bf" stroke="#f59f00" stroke-width="1"/></svg>환생</button>
 <button class="sbtn" id="bPet"><b>🐾</b>펫</button>
 <button class="sbtn" id="bEgg"><b>🥚</b>알</button>
 <button class="sbtn" id="bWorld"><b>🌍</b>세계</button>
 <button class="sbtn" id="bName"><b>✏️</b>이름</button>
 <button class="sbtn" id="bReset"><b>⏮️</b>처음부터</button>
 <button class="sbtn" id="bMus"><b>🎵</b>음악</button>
 <button class="sbtn" id="bSnd"><b>🔊</b>소리</button>
</div>
<button id="auto"><b>▶</b>자동 승리</button>
<button id="chatBtn">💬 채팅</button>
<div id="quick"></div>
<div id="stats">
 <div class="st c1"><small>📏 크기</small><span id="sSize">1.000</span></div>
 <div class="st c2"><small>🏆 승리</small><span id="sWins">0</span></div>
 <div class="st c3"><small>⭐ 환생</small><span id="sRb">0</span></div>
 <div class="st c4"><small>⚡ 배수</small><span id="sPow">×1</span></div>
</div>
<div id="prompt"><button id="promptB"></button></div>
<div id="toast"></div>
<div id="record">[가장 환생 많이한 기록-100번 : <b>플레이어DDddDDDdDdDd09</b>]</div>
<div id="joy"><i id="joyK"></i></div>
<button id="jump">점프</button>
<div id="modal"><div id="panel"><button class="x" id="mx">✕</button><div id="pc"></div></div></div>
<div id="hatch"><div id="hView"></div><h3 id="hName"></h3><div id="hInfo" style="font-size:16px;font-weight:700;margin-bottom:14px"></div><button class="btn" id="hOk" style="display:none">좋아!</button></div>

<script>
(()=>{
'use strict';
// ================= 데이터 =================
const SEQ=(()=>{const s=[1,1.5,2,3,4,5,6,7];while(s.length<=100){const l=s[s.length-1];s.push(l+.5,l+1,l+1.5,l+2,l+3,l+4,l+5,l+6);}return s.slice(0,101);})();
const TMS=[{r:0,m:1},{r:1,m:1.5},{r:2,m:2},{r:3,m:2.2},{r:7,m:3},{r:15,m:4},{r:50,m:7},{r:80,m:9}];
const bestTm=r=>{let m=1;for(const t of TMS)if(r>=t.r)m=t.m;return m;};
const rbCost=r=>150*SEQ[r]*bestTm(r)*(1+r/15);   // 환생에 필요한 '작아진 양'
const SIZE_K=75;
const sizeOf=S=>1/(1+S/SIZE_K);
const Sfor=h=>SIZE_K*(1/h-1);
const vis=s=>Math.max(0.012,Math.pow(s,0.35));    // 화면에 보이는 크기
const HR=h=>3.9*vis(h);                            // 동그라미 구멍 반지름
const WORLDS=[
 {name:'세계 1 · 초원',holes:[...Array(16)].map((_,i)=>Math.pow(0.72,i)),wins:[1,3,5,6,10,15,20,30,50,70,100,120,170,200,250,270],
  sky:0x8fd3ff,ground:0x5fbf4a,fog:0xbfe6ff,wall:[0x9aa6b8,0x7f8ca0]},
 {name:'세계 2 · 사막',holes:[...Array(16)].map((_,i)=>0.3*Math.pow(0.62,i)),wins:[2,5,8,12,18,26,38,52,70,95,130,170,230,300,390,500],
  sky:0xffc98a,ground:0xe6c27a,fog:0xffe0b0,wall:[0xc99a5b,0xb5834a]}
];
const W2_NEED=550;
const WALL_Z=i=>-14-24*i, PAD_Z=i=>WALL_Z(i)-12, PAD_X=14, WALL_T=2.4;
const PETS={
 dog:{n:'강아지',e:'🐶',m:1.3,r:'일반'},cat:{n:'고양이',e:'🐱',m:1.3,r:'일반'},parrot:{n:'앵무새',e:'🦜',m:1.7,r:'레어'},
 panda:{n:'판다',e:'🐼',m:2,r:'전설'},raccoon:{n:'너구리',e:'🦝',m:2,r:'전설'},shark:{n:'상어',e:'🦈',m:2.3,r:'신화'},
 fish:{n:'열대어',e:'🐠',m:1.5,r:'일반'},turtle:{n:'거북이',e:'🐢',m:1.5,r:'일반'},croc:{n:'악어',e:'🐊',m:1.8,r:'레어'},
 eagle:{n:'독수리',e:'🦅',m:1.8,r:'레어'},gorilla:{n:'고릴라',e:'🦍',m:2,r:'전설'},tiger:{n:'호랑이',e:'🐯',m:2.5,r:'신화'},
 scorpion:{n:'전갈',e:'🦂',m:1.8,r:'일반'},sandcat:{n:'모래고양이',e:'🐈',m:2,r:'일반'},fennec:{n:'사막여우',e:'🦊',m:2.3,r:'레어'},
 llama:{n:'라마',e:'🦙',m:2.8,r:'전설'},camel:{n:'낙타',e:'🐫',m:3,r:'신화'}
};
const EGGS={
 normal:{n:'일반 알',price:110,world:0,color:0xf1f3f5,odds:[['dog',30],['cat',30],['parrot',25],['panda',6.5],['raccoon',6.5],['shark',2]]},
 jungle:{n:'정글 알',price:200,world:0,color:0x51cf66,odds:[['fish',30],['turtle',30],['croc',13],['eagle',13],['gorilla',11],['tiger',3]]},
 desert:{n:'사막 알',price:220,world:1,color:0xf0b45a,odds:[['scorpion',30],['sandcat',30],['fennec',25],['llama',12],['camel',3]]}
};
const MAX_EQ=3, MAX_INV=40;
const AI_NAMES=['Lala1738','King_Kong33','baby5757','OH7l','ElLl','Miska1017','Junho1013','kkkkkkkkk11','MIKY0901','GOODgame_3418','Tiger66','LIFE_TASTE11','OOOOXXXX13','K78K_35','ARIA1012','jAkE0408','HARIBO_1988'];
const SPAWN={x:0,z:20};

// ================= 저장 =================
const SAVE_KEY='shrinkSim_v1';
let P={name:'Guest_'+(1000+Math.floor(Math.random()*9000)),S:0,rb:0,wins:0,pets:[],eq:[],world:0,w2:false,nextId:1};
try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(d&&typeof d==='object')P=Object.assign(P,d);}catch(e){}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(P));}catch(e){}}
if(!P.w2&&P.world===1)P.world=0;

// ================= 유틸 =================
const $=id=>document.getElementById(id);
function fmtSize(s){if(s>=0.01)return s.toFixed(3);const d=Math.min(12,Math.ceil(-Math.log10(s))+2);return s.toFixed(d);}
function fmtN(n){if(n<1000)return (Math.round(n*10)/10).toString();const u=['K','M','B','T'];let i=-1;while(n>=1000&&i<3){n/=1000;i++;}return n.toFixed(n<10?2:1)+u[i];}
function fmtM(m){return '×'+(Math.round(m*100)/100);}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function petMult(){let t=1;for(const id of P.eq){const p=P.pets.find(x=>x.id===id);if(p)t+=PETS[p.t].m-1;}return t;}
function power(){return SEQ[P.rb]*petMult();}

// ================= 소리 =================
let AC=null,muted=false;
function beep(f=600,d=.08,type='square',v=.05,slide=0){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.linearRampToValueAtTime(f+slide,AC.currentTime+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const sfx={tap:()=>beep(900+Math.random()*200,.05,'sine',.04,-300),win:()=>{beep(660,.1,'square',.05);setTimeout(()=>beep(880,.1,'square',.05),90);setTimeout(()=>beep(1320,.18,'square',.05),180);},
 rb:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,'triangle',.07),i*110));},hatch:()=>{[400,500,650,900,1200].forEach((f,i)=>setTimeout(()=>beep(f,.12,'sine',.07),i*80));},
 no:()=>beep(160,.15,'sawtooth',.04),jump:()=>beep(420,.1,'sine',.04,250)};

// ================= UI 공통 =================
let toastT=0;
function toast(t,ms=1600){const el=$('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity=0,ms);}
function bigpop(t,color){const d=document.createElement('div');d.className='bigpop';d.textContent=t;if(color)d.style.color=color;document.body.appendChild(d);setTimeout(()=>d.remove(),1300);}

const geoCache={};
function rgeo(w,h,d,r){r=Math.min(r,w/2-0.002,h/2-0.002,d/2-0.002);const key=[w,h,d,r].map(x=>x.toFixed(3)).join(',');if(geoCache[key])return geoCache[key];
 if(r<0.015)return geoCache[key]=new THREE.BoxGeometry(w,h,d);
 const iw=w-2*r,ih=h-2*r,rc=Math.min(r*0.6,iw/2,ih/2)*0.999;const s=new THREE.Shape(),x=-iw/2,y=-ih/2;
 if(rc>0.001){s.moveTo(x+rc,y);s.lineTo(x+iw-rc,y);s.quadraticCurveTo(x+iw,y,x+iw,y+rc);s.lineTo(x+iw,y+ih-rc);s.quadraticCurveTo(x+iw,y+ih,x+iw-rc,y+ih);s.lineTo(x+rc,y+ih);s.quadraticCurveTo(x,y+ih,x,y+ih-rc);s.lineTo(x,y+rc);s.quadraticCurveTo(x,y,x+rc,y);}
 else{s.moveTo(x,y);s.lineTo(x+iw,y);s.lineTo(x+iw,y+ih);s.lineTo(x,y+ih);s.lineTo(x,y);}
 const g=new THREE.ExtrudeGeometry(s,{depth:Math.max(0.001,d-2*r),bevelEnabled:true,bevelThickness:r,bevelSize:r,bevelSegments:4,curveSegments:5});

function makeChar(name,shirt=0x0d69ac,pants=0xa4bd47,skin=0xf5cd30,isMe=false){

 const mkLimb=(x,y,c)=>{const p=new THREE.Group();p.position.set(x,y,0);rbox(0.96,2,0.96,c,0,-1,0,p,0.32);g.add(p);return p;};
 const aL=mkLimb(-1.5,4,skin),aR=mkLimb(1.5,4,skin),lL=mkLimb(-0.5,2,pants),lR=mkLimb(0.5,2,pants);

 const tag=label(name,{color:isMe?'#ffe066':'#ffffff',bg:null,size:52,scale:4.6});tag.position.y=6.4;g.add(tag);

function moveToward(o,tx,tz,dt,sp){const dx=tx-o.x,dz=tz-o.z,d=Math.hypot(dx,dz);if(d<0.15*sp/10+0.05){o.x=tx;o.z=tz;return true;}const st=Math.min(d,sp*dt);o.x+=dx/d*st;o.z+=dz/d*st;o.face=Math.atan2(dx,dz);return false;}
function speedFor(v){return 16*(0.75+0.25*v);}
function updateAI(a,dt){
 const s=sizeOf(a.S),v=vis(s),pw=SEQ[a.rb]*a.pm;let amp=0;
 const tm=aiTmIndex(a),tp=TM_POS(tm);
 if(a.state==='toTread'){amp=1;if(moveToward(a,tp.x+a.off,tp.z+a.off,dt,speedFor(v))){a.state='tread';a.timer=rnd(8,35);a.face=Math.PI;}a.S+=0.35*pw*dt;}
 else if(a.state==='tread'){amp=1;a.S+=TMS[tm].m*pw*dt+a.tap*0.15*pw*dt*3;a.timer-=dt;
  if(a.rb<100&&a.S>=rbCost(a.rb)&&Math.random()<dt*0.2){a.rb++;a.S=0;if(Math.random()<.4)chat(`${a.name}님이 환생했어요! (환생 ${a.rb})`);}
  if(a.timer<=0){a.target=aiTarget(a);if(a.target>=0){if(Math.random()<.3)a.target=Math.floor(rnd(0,a.target+1));a.state='toLane';}else a.timer=rnd(5,15);}}
 else if(a.state==='toLane'){amp=1;a.S+=0.35*pw*dt;if(moveToward(a,a.off*0.3,-4,dt,speedFor(v)))a.state='run';}
 else if(a.state==='run'){amp=1;a.S+=0.35*pw*dt;if(moveToward(a,a.off*0.3,PAD_Z(a.target),dt,speedFor(v)))a.state='side';}
 else if(a.state==='side'){amp=1;if(moveToward(a,PAD_X,PAD_Z(a.target),dt,speedFor(v))){a.wins+=WORLDS[a.world].wins[a.target];a.x=SPAWN.x+rnd(-3,3);a.z=SPAWN.z+rnd(-1,1);a.state='toTread';
   if(a.wins>=W2_NEED&&Math.random()<.15)a.world=1-a.world;}}
 a.y=(a.state==='tread')?0.41:0;
 a.mesh.visible=a.world===P.world;
 a.mesh.position.set(a.x,a.y,a.z);a.mesh.scale.setScalar(v);a.mesh.rotation.y=a.face;animChar(a.mesh,amp,dt);
}
function aiChurn(){
 const present=new Set(ais.map(a=>a.name));
 if(ais.length>5&&(Math.random()<.5||ais.length>=8)){removeAI(pick(ais));}
 else if(ais.length<8){const free=AI_NAMES.filter(n=>!present.has(n));if(free.length)addAI(pick(free));}
 setTimeout(aiChurn,rnd(20000,55000));
}

let autoOn=false,rbKey='',lastT=performance.now(),acc=0,lbT=0,saveT=0,msgT=0,lockT=0,blockT=0,camV=1;
function stepPlayer(dt){
 const s=size(),v=vis(s),W=WORLDS[P.world];
 let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;
 let iz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joy.y;
 const il=Math.hypot(ix,iz);if(il>1){ix/=il;iz/=il;}
 let moving=il>0.12;
 const sp=speedFor(v);
 const cy=Math.cos(CAM.yaw),sy=Math.sin(CAM.yaw);let wx=ix*cy+iz*sy,wz=-ix*sy+iz*cy;
 if(autoOn&&!moving){ // 자동 승리: 갈 수 있는 가장 먼 구멍까지 가서 승리 판 밟기
  let k=-1;W.holes.forEach((h,i)=>{if(s<=h)k=i;});
  if(k>=0){const pz=PAD_Z(k);let tx,tz;
   if(me.z>pz+0.3){tx=0;tz=pz;if(Math.abs(me.x)>1.5&&me.z>-6)tz=Math.min(me.z,-4);}else{tx=PAD_X;tz=pz;}
   const dx=tx-me.x,dz=tz-me.z,dd=Math.hypot(dx,dz);if(dd>0.05){wx=dx/dd;wz=dz/dd;if(dd<sp*dt){wx*=dd/(sp*dt);wz*=dd/(sp*dt);}moving=true;}}}
 let nx=me.x+wx*sp*dt,nz=me.z+wz*sp*dt;
 if(moving)me.face=Math.atan2(wx,wz);
 // 경계
 nz=Math.min(25,Math.max(CORR_END()+1.5,nz));nx=Math.max(-39,Math.min(39,nx));
 if(nz>-6&&Math.abs(nx)>30){if(me.z<=-6)nz=me.z;else nx=Math.sign(nx)*30;}
 // 벽
 const pd=WALL_T/2+0.5*v;
 W.holes.forEach((h,i)=>{
  const wz=WALL_Z(i);const can=s<=h;
  if(can&&Math.abs(nz-wz)<3&&Math.abs(nx)<7)nx+=(0-nx)*Math.min(1,10*dt);
  if(nz>wz-pd&&nz<wz+pd){
   const ok=can&&Math.abs(nx)<=Math.max(0.02,0.8*HR(h)-1.9*v);
   if(!ok){nz=me.z;if(nz>wz-pd&&nz<wz+pd)nz=(me.z>wz)?wz+pd:wz-pd;}
  }
 });
 me.x=nx;me.z=nz;
 // 러닝머신 위?
 let onTm=-1;TMS.forEach((t,i)=>{const p=TM_POS(i),D=TM_DIM(i);if(Math.abs(me.x-p.x)<D.w/2&&Math.abs(me.z-p.z)<D.l/2)onTm=i;});
 const floor=onTm>=0?0.41:0;
 me.vy-=60*v*dt;me.y+=me.vy*dt;if(me.y<=floor){me.y=floor;me.vy=0;me.grounded=true;}
 // 작아지기
 const pw=power();let rate=0;
 if(onTm>=0){if(P.rb>=TMS[onTm].r)rate=TMS[onTm].m;else if(performance.now()-lockT>1500){lockT=performance.now();toast(`🔒 환생 ${TMS[onTm].r} 이상부터 쓸 수 있어요`);sfx.no();}}
 if(moving&&rate===0)rate=0.35;
 P.S+=rate*pw*dt;
 // 승리 판
 for(let i=0;i<16;i++){if(Math.abs(me.x-PAD_X)<3&&Math.abs(me.z-PAD_Z(i))<1.5&&me.y<0.6){const g=W.wins[i];P.wins+=g;sfx.win();bigpop(`+${g} 승리! 🏆`);teleportSpawn();save();break;}}
 // 가까이 있는 것
 let pk=null;
 for(const k in EGGS){const E=EGGS[k];if(E.world!==P.world)continue;const p=EGG_POS[k];if(Math.hypot(me.x-p.x,me.z-p.z)<4){pk=k;
   setPrompt('egg'+k,P.wins>=E.price?`🥚 ${E.n} 열기 (🏆 ${E.price})  [E]`:`🥚 ${E.n} · 승리 ${E.price}개 필요`,()=>{if(P.wins>=E.price)buyEgg(k);else{sfx.no();toast(`승리가 ${E.price-P.wins}개 더 필요해요`);}},P.wins<E.price);}}
 if(!pk&&Math.hypot(me.x-PORTAL.x,me.z-PORTAL.z)<4){pk='portal';setPrompt('portal','🌍 세계 이동  [E]',()=>show('world'));}
 if(!pk)setPrompt(null);
 // 메쉬
 const onBelt=onTm>=0&&P.rb>=TMS[onTm].r&&!moving;
 if(onBelt)me.face=Math.PI;
 me.mesh.position.set(me.x,me.y,me.z);me.mesh.scale.setScalar(v);
 let df=me.face-me.mesh.rotation.y;while(df>Math.PI)df-=2*Math.PI;while(df<-Math.PI)df+=2*Math.PI;me.mesh.rotation.y+=df*Math.min(1,12*dt);
 me.amp=(moving||onBelt)&&me.grounded?1:0;animChar(me.mesh,me.amp,dt);
 if(!(moving||onBelt)){const u=me.mesh.userData;['aL','aR','lL','lR'].forEach(k=>u[k].rotation.x*=0.8);}
 // 펫
 me.petMeshes.forEach((p,i)=>{const ang=me.mesh.rotation.y+Math.PI+(i-1)*0.7;const r=3.2*v;const tx=me.x+Math.sin(ang)*r,tz=me.z+Math.cos(ang)*r;p.x+=(tx-p.x)*Math.min(1,6*dt);p.z+=(tz-p.z)*Math.min(1,6*dt);
  const tm=performance.now()/1000,fl=p.s.userData.fly||p.s.userData.swim;const ps=1.15*v;
  p.s.position.set(p.x,me.y+(fl?1.3+Math.sin(tm*3+i)*0.2:Math.abs(Math.sin(tm*(moving?9:3)+i))*0.25)*ps,p.z);p.s.scale.setScalar(ps);
  let pr=me.mesh.rotation.y-p.s.rotation.y;while(pr>Math.PI)pr-=2*Math.PI;while(pr<-Math.PI)pr+=2*Math.PI;p.s.rotation.y+=pr*Math.min(1,6*dt);animPet(p.s,tm,i);});
 beltTexs.forEach((t,i)=>t.offset.y-=dt*(0.75+i*0.12));
 return v;
}
const CAM={yaw:0,pitch:0.42,zoom:1};
function updateCamera(v,dt){
 camV+=(v-camV)*Math.min(1,4*dt);
 if(keys.KeyQ)CAM.yaw+=dt*2;if(keys.KeyR)CAM.yaw-=dt*2;
 const cp=Math.cos(CAM.pitch),dx=Math.sin(CAM.yaw)*cp,dy=Math.sin(CAM.pitch),dz=Math.cos(CAM.yaw)*cp;
 let L=20*camV*CAM.zoom;
 for(let i=0;i<16;i++){const wz=WALL_Z(i);
  if(dz>0.02&&wz>me.z){const wf=wz-WALL_T/2-0.04;if((wf-me.z)/dz<L)L=Math.max(0.35*camV,(wf-me.z)/dz);}
  if(dz<-0.02&&wz<me.z){const wf=wz+WALL_T/2+0.04;if((wf-me.z)/dz<L)L=Math.max(0.35*camV,(wf-me.z)/dz);}}
 const ty=me.y+3.4*camV;
 camera.position.set(me.x+dx*L,Math.max(ty*0.15,ty+dy*L),me.z+dz*L);camera.lookAt(me.x,ty,me.z);
 const nn=Math.max(0.0015,0.04*camV);if(Math.abs(camera.near-nn)/nn>0.1){camera.near=nn;camera.updateProjectionMatrix();}
}
function updateHUD(){
 const s=size();$('sSize').textContent=fmtSize(s);$('sWins').textContent=P.wins.toLocaleString();$('sRb').textContent=P.rb;$('sPow').textContent=fmtM(power());
 const canRb=P.rb<100&&P.S>=rbCost(P.rb);$('bRb').classList.toggle('glow',canRb);
}
function updateLB(){
 const list=[{name:P.name,S:P.S,rb:P.rb,me:true},...[...netPeers.values()].map(n=>({name:'🟢 '+n.name,S:n.S||0,rb:n.rb||0})),...ais.map(a=>({name:a.name,S:a.S,rb:a.rb}))].sort((a,b)=>b.S-a.S);
 $('lbT').innerHTML='<tr><th>#</th><th>이름</th><th style="text-align:right">크기</th><th style="text-align:right">환생</th></tr>'+list.map((e,i)=>`<tr class="${e.me?'me':''}"><td>${i+1}</td><td>${e.name}</td><td class="n">${fmtSize(sizeOf(e.S))}</td><td class="n">${e.rb}</td></tr>`).join('');
}
function loop(now){
 let dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
 const v=stepPlayer(dt);
 ais.forEach(a=>updateAI(a,dt));
 updateNet(dt);
 if(worldG&&worldG.userData.anims){const tt=now/1000;worldG.userData.anims.forEach(f=>f(tt,dt));rainbowMats.forEach((m,k)=>m.color.setHSL((tt*0.25+k*0.13)%1,0.85,0.58));}
 if(worldG)worldG.children.forEach(o=>{if(o.userData.spin)o.rotation.y+=dt*0.8;if(o.userData.spin2)o.rotation.y+=dt*0.9;if(o.userData.spinZ)o.rotation.x+=dt*1.5;});
 updateCamera(v,dt);
 lbT-=dt;if(lbT<=0){lbT=0.25;updateLB();updateHUD();if(openPanel==='rb'){const k=P.rb+'|'+(P.S>=rbCost(P.rb));if(k!==rbKey){rbKey=k;render();}else if(P.rb<100&&$('rbBar')){const pct=Math.min(100,P.S/rbCost(P.rb)*100);$('rbBar').style.width=pct+'%';$('rbPct').textContent=pct.toFixed(1)+'%';$('rbSize').textContent=fmtSize(size());}}}
 saveT-=dt;if(saveT<=0){saveT=3;save();}
 renderer.render(scene,camera);
 if(hatch.on)hatchFrame(dt);
 requestAnimationFrame(loop);
}

// ================= 시작 =================
function start(){
 $('loading').style.display='none';
 buildWorld(P.world);
 me.mesh=makeChar(P.name,...OUTFITS[me.outfit||0],0xf5cd30,true);scene.add(me.mesh);
 teleportSpawn();rebuildPets();
 const names=AI_NAMES.slice().sort(()=>Math.random()-.5).slice(0,8);names.forEach(n=>addAI(n,true));
 chat(`${P.name}님, 작아지기 시뮬레이터에 오신 걸 환영해요!`);
 chat('러닝머신에 올라가거나 화면을 눌러서 작아져 보세요.',false);
 setTimeout(aiChurn,rnd(15000,30000));
 initMini();
 initNet();
 if(!P.named)show('name');
 if(innerWidth<640){$('lbT').style.display='none';$('lbTog').textContent='▸';}
 updateLB();updateHUD();
 requestAnimationFrame(t=>{lastT=t;loop(t);});
}
let started=false;const go=()=>{if(!started){started=true;start();}};
if(document.fonts&&document.fonts.ready){document.fonts.load('900 20px "Noto Sans KR"').then(go,go);setTimeout(go,2500);}else go();
// 테스트용 훅
window.__game={P,ais,me,rbCost,sizeOf,WORLDS,SEQ,goWorld,doRebirth,netPeers};
})();
</script>
